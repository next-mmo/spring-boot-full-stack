name: Verify Agent Workflow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-agent-workflow.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked workflow CLI
        run: npm ci

      - name: Doctor
        run: npm exec -- agent-workflow doctor

      - name: Workflow consistency
        run: npm exec -- agent-workflow check

      - name: Documentation budgets
        run: npm exec -- agent-workflow docs

      - name: Remove one-time verification workflow
        run: rm .github/workflows/verify-agent-workflow.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: remove workflow verification bootstrap"
          git push
